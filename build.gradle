buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath 'org.ajoberstar:grgit:1.7.0'
    }
    configurations.all {
        resolutionStrategy {
            force 'org.ow2.asm:asm:6.0_BETA'
        }
    }
}

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = 'com.boydti.fawe'

def revision = ""
def buildNumber = ""
def semver = ""
def date = ""
ext {
    try {
        git = org.ajoberstar.grgit.Grgit.open(file(".git"))
        date = git.head().date.format("yy.MM.dd")
        revision = "-${git.head().abbreviatedId}"
        parents = git.head().parentIds
        index = -67
        int major = 0, minor = 0, patch = 0
        while (parents != null && !parents.isEmpty()) {
            int majorCount = 0, minorCount = 0, patchCount = 0
            if (minor == 0 && major == 0) patchCount = 1
            commit = git.resolve.toCommit(parents.get(0))
            for (String line : commit.fullMessage.tokenize("\n")) {
                switch (line.replaceAll("- ", "").split(" ")[0].toLowerCase()) {
                    case "minor":
                    case "added":
                    case "add":
                    case "change":
                    case "changed":
                    case "changes":
                        if (major == 0) {
                            minorCount = 1; patchCount = 0
                        }
                        break
                    case "refactor":
                    case "remove":
                    case "major":
                        patchCount = minorCount = 0
                        majorCount = 1
                        break
                }
            }
            major += majorCount
            minor += minorCount
            patch += patchCount
            parents = commit.parentIds
            index++
        }
        buildNumber = "-${index}"
        semver = "-${major}.${minor}.${patch}"
    } catch (Throwable ignore) {
        revision = "unknown"
    }
}

version = project.hasProperty("lzNoVersion") ? "unknown" : date + revision + buildNumber + semver
description = "FastAsyncWorldEdit"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        maven { url "https://repo.minebench.de/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://repo.dmulloy2.net/content/groups/public/" }
        maven { url "https://repo.destroystokyo.com/repository/maven-public/" }
        maven { url "https://ci.athion.net/plugin/repository/tools/" }
        maven { url "https://hub.spigotmc.org/nexus/content/groups/public/" }
        maven { url "https://nexus.hc.to/content/repositories/pub_releases" }
        maven { url "https://maven.enginehub.org/repo/" }
        maven { url "https://repo.spongepowered.org/maven" }
        maven { url "https://repo.inventivetalent.org/content/groups/public/" }
        maven { url "https://store.ttyh.ru/libraries/" }
        maven { url "https://repo.dmulloy2.net/nexus/repository/public/" }
        maven { url "https://maven.elmakers.com/repository/" }
        maven { url "https://ci.ender.zone/plugin/repository/everything/" }
        maven { url "https://plotsquared.com/mvn/" }
        maven { url "https://repo.dustplanet.de/artifactory/ext-release-local/" }
        maven { url "https://repo.stellardrift.ca/maven/snapshots/" }
        maven { url "https://jitpack.io" }
        maven { url "https://repo.codemc.io/repository/maven-public/" }

    }
}

tasks.register("setupCIWorkspace") {
    doLast {
        println "CI workspace setup placeholder"
    }
}

tasks.register("aggregatedJavadocs", Javadoc) {
    destinationDir = file("./docs/javadoc")
    title = "$project.name $version API"
    options.author = true
    options.links(
            'https://docs.spring.io/spring/docs/4.3.x/javadoc-api/',
            'https://docs.oracle.com/javase/8/docs/api/',
            'https://docs.spring.io/spring-ws/docs/2.3.0.RELEASE/api/',
            'https://docs.spring.io/spring-security/site/docs/4.0.4.RELEASE/apidocs/'
    )
    options.addStringOption('Xdoclint:none', '-quiet')
    delete "./docs"

    subprojects.each { proj ->
        proj.tasks.withType(Javadoc).configureEach { javadocTask ->
            source += javadocTask.source
            classpath += javadocTask.classpath
            excludes += javadocTask.excludes
            includes += javadocTask.includes
        }
    }
}

tasks.named("clean") {
    delete "target"
}
